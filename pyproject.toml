[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hrqde-c"
version = "0.1.0"
description = "HR-QDE Säule C - NLP-Pipeline für Kompetenzextraktion aus Stellenanzeigen (MVP)"
authors = [{name = "Manuel Sitzler", email = "sitzlermanuel@gmail.com"}]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "spacy>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
hrqde-c = "hrqde_c.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
